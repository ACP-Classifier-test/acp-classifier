[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-classifier"
version = "1.0.2"
description = "Clasificación de péptidos anticancerígenos (ACPs) mediante modelos de lenguaje proteico"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brayan Arturo Navarro Sinuco" },
    { name = "Ivan Andres Mendoza Oñate" },
]
maintainers = [
    { name = "Escuela de Ingeniería de Sistemas e Informática, Universidad Industrial de Santander" },
]
keywords = [
    "bioinformatics", "anticancer-peptides", "acp", "protein-language-model",
    "esm2", "peptide-classification", "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "joblib>=1.3",
    # Piso conservador: 2.2.0 es la primera serie de torch con ruedas para
    # Python 3.12. Para Python 3.13 y 3.14, pip resuelve por su cuenta una serie
    # más reciente (2.5.0 y 2.9.0 son las mínimas con ruedas, respectivamente).
    # En Linux, la rueda de PyPI arrastra triton y los paquetes nvidia-cu13; para
    # evitarlo hay que instalar torch desde el índice de CPU ANTES que este
    # paquete, o usar requirements-cpu.txt (véase el README).
    "torch>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/ACP-Classifier-test/acp-classifier"
Repository = "https://github.com/ACP-Classifier-test/acp-classifier"
Issues = "https://github.com/ACP-Classifier-test/acp-classifier/issues"

[project.scripts]
acp-classifier = "acp_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acp_classifier = ["modelos/*.joblib"]
