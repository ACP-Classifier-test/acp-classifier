name: publicar

# Publica en PyPI mediante *trusted publishing* (OIDC): PyPI confía en este
# repositorio y en este archivo de workflow concretos, de modo que no hace falta
# guardar ningún token de API como secreto de GitHub. La credencial es un token
# efímero que GitHub emite para cada ejecución y que caduca en minutos.
#
# Se dispara al empujar una etiqueta `vX.Y.Z`, o a mano desde la pestaña Actions
# (útil para una etiqueta que ya estaba subida antes de existir este workflow).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Guarda: la versión de pyproject.toml y la de la etiqueta tienen que
      # coincidir. Publicar en PyPI es irreversible y un número de versión no se
      # puede reutilizar, así que el desajuste debe parar aquí y no después.
      - name: Comprobar que la etiqueta coincide con la versión del paquete
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          paquete="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "etiqueta=$etiqueta  pyproject=$paquete"
          if [ "$etiqueta" != "$paquete" ]; then
            echo "FALLO: la etiqueta v$etiqueta no coincide con la versión $paquete de pyproject.toml" >&2
            exit 1
          fi

      - name: Construir la distribución
        run: |
          pip install build twine
          python -m build

      - name: Validar los metadatos del paquete
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      # Necesario para que GitHub emita el token OIDC que PyPI verifica.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
